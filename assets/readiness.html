<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>达人微信收集任务助手</title>
<!-- title: KOC 商务状态页; owner: APU Workshop; status: candidate; updated: 2026-10-08; change: remove supplemental panels and add direct Feishu table link -->
<style>:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#173b30;background:#f5f7f4}*{box-sizing:border-box}main{max-width:720px;padding:36px 22px;margin:auto}small,.stamp{color:#668075;font-size:12px}h1{font-size:28px;margin:10px 0 24px}.panel,details{background:white;border:1px solid #dce5df;border-radius:14px;padding:22px;margin-bottom:16px}.list{display:grid;gap:15px}.row{display:flex;gap:12px;align-items:center}.row span:last-child{margin-left:auto;font-size:14px;color:#5a7066}.next{border-left:4px solid #d7ab41;background:#fff9e9}.next strong{display:block;font-size:13px;margin-bottom:8px}.next p{margin:0;line-height:1.7}#progress{font-size:22px;font-weight:600;margin:0 0 8px}#runMeta{font-size:14px;color:#5a7066;line-height:1.7;margin:0}summary{cursor:pointer;font-weight:600}li{line-height:1.8;color:#52695e;margin:10px 0}.machine{margin:16px 0;padding:12px;background:#f4f7f4;border-radius:8px;line-height:1.8;font-size:14px}.foot{font-size:12px;line-height:1.7;color:#668075}#freshness{font-size:13px;line-height:1.7;margin-bottom:18px}button{background:#17644e;color:white;border:0;border-radius:8px;padding:10px 16px;margin:0 12px 16px 0;cursor:pointer}button:disabled{opacity:.6}.warn{color:#8a6316!important}[hidden]{display:none!important}@media(max-width:500px){main{padding:24px 16px}.panel,details{padding:18px}.row{flex-wrap:wrap}.row span:last-child{font-size:13px}}h2{font-size:18px;margin:22px 0 12px}h3{font-size:16px;margin:0 0 16px}.row{align-items:flex-start;flex-wrap:wrap}.row .action{flex-basis:100%;margin:-8px 0 0 30px;font-size:12px;color:#8a6316;line-height:1.6}.count{font-size:22px;font-weight:600;margin:0 0 8px}.meta{font-size:13px;line-height:1.8;color:#668075}progress{width:100%;height:10px;border:0;border-radius:8px;accent-color:#248061;margin:6px 0 10px}progress::-webkit-progress-bar{background:#eaf0eb;border-radius:8px}progress::-webkit-progress-value{background:#248061;border-radius:8px}.results{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.result{padding:10px 12px;border-radius:8px;background:#f1f6f2;display:flex;justify-content:space-between;gap:10px;font-size:13px}.result strong{font-size:16px}@media(max-width:400px){.results{grid-template-columns:1fr}} .card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.card-heading h3{margin:0}.table-link{display:inline-block;padding:8px 12px;border:1px solid #c7dcd0;border-radius:8px;color:#17644e;background:#f1f6f2;text-decoration:none;font-size:13px;white-space:nowrap}.table-link:hover{background:#e4efe7}.table-link:focus-visible{outline:2px solid #17644e;outline-offset:3px}.row .status{margin-left:auto;font-size:14px}.row .needs-action{color:#bd3434}.row .action{color:#668075}</style></head><body><main>
<small>KOC 达人商务</small><h1>达人微信收集任务助手</h1><p id="freshness" class="stamp"></p><h2>任务开始前准备</h2><section class="panel"><div id="checklist" class="list"></div></section><h2>任务执行状态</h2><section class="panel"><h3>A · 基于蝉妈妈做条目更新</h3><p id="sourceProgress" class="count"></p><progress id="sourceBar" aria-label="蝉妈妈条目更新进度"></progress><p id="sourceMeta" class="meta"></p></section><section id="run" class="panel"><div class="card-heading"><h3>B · 微信采集更新</h3><a id="tableLink" class="table-link" hidden target="_blank" rel="noopener noreferrer">打开飞书表 ↗</a></div><p id="progress" class="count"></p><progress id="contactBar" aria-label="微信采集进度"></progress><p id="runMeta" class="meta"></p><div id="results" class="results"></div></section>
</main>
<script type="application/json" id="readiness-snapshot">null</script><script>
'use strict';
function blank(){return{schemaVersion:1,checkedAt:null,validForSeconds:300,sites:{chann:{state:'unknown'},buyin:{state:'unknown'}},component:'unknown',base:{read:'unknown',write:'unknown'}}}
function validate(x){if(!x||x.schemaVersion!==1||!x.sites||!x.base)throw Error('检查结果格式无效');for(const k of ['chann','buyin'])if(!['unknown','logged_out','logged_in','authorized'].includes(x.sites[k]?.state))throw Error('网站状态无效');if(!['unknown','missing','ready'].includes(x.component)||!['unknown','missing','granted'].includes(x.base.read)||!['unknown','missing','granted'].includes(x.base.write))throw Error('准备状态无效');if(!x.checkedAt||!Number.isFinite(Date.parse(x.checkedAt))||Date.parse(x.checkedAt)>Date.now()+60000||!Number.isInteger(x.validForSeconds)||x.validForSeconds<1||x.validForSeconds>3600)throw Error('检查时间无效');if(x.run){const r=x.run;if(!['running','cooldown','paused','completed'].includes(r.state)||!Number.isInteger(r.total)||r.total<0||!Number.isInteger(r.completed)||r.completed<0||r.completed>r.total||r.targetLanes!==10||!Number.isInteger(r.actualLanes)||r.actualLanes<0||r.actualLanes>10)throw Error('运行状态无效');if(r.state==='completed'&&(r.completed!==r.total||r.readbackVerified!==true))throw Error('完成证据不足');if(r.nextProbeAt!==undefined&&!(typeof r.nextProbeAt==='number'?Number.isFinite(r.nextProbeAt)&&r.nextProbeAt>0:Number.isFinite(Date.parse(r.nextProbeAt))))throw Error('探测时间无效');if(r.observedAt!==undefined&&!Number.isFinite(Date.parse(r.observedAt)))throw Error('运行观察时间无效');if(r.reason!==undefined&&(typeof r.reason!=='string'||r.reason.length>200))throw Error('业务原因无效')}if(x.sourceUpdate){const u=x.sourceUpdate;if(!['completed','running','unknown'].includes(u.state))throw Error('来源状态无效');for(const k of ['completed','total','added','selected','totalRecords'])if(u[k]!==undefined&&(!Number.isInteger(u[k])||u[k]<0))throw Error('来源数量无效');if(u.completed!==undefined&&u.total!==undefined&&u.completed>u.total)throw Error('来源进度无效')}if(x.run?.results){for(const n of Object.values(x.run.results))if(!Number.isInteger(n)||n<0)throw Error('分类数量无效')}return x}
function stale(x,now=Date.now()){return !x.checkedAt||now-Date.parse(x.checkedAt)>x.validForSeconds*1000}
let state=blank(),invalid=false;try{const x=JSON.parse(document.getElementById('readiness-snapshot').textContent);if(x!==null)state=validate(x)}catch{invalid=true}
function setProgress(id,completed,total){const el=document.getElementById(id);if(Number.isInteger(completed)&&Number.isInteger(total)&&total>0){el.max=total;el.value=completed;el.hidden=false;el.setAttribute('aria-valuetext',`${completed} / ${total}`)}else{el.hidden=true;el.removeAttribute('value')}}
function render(){const link=document.getElementById("tableLink");link.hidden=true;link.removeAttribute("href");try{const u=new URL(state.baseUrl);if(u.protocol==="https:"&&!u.username&&!u.password&&/\.(feishu\.cn|larksuite\.com)$/.test(u.hostname)){link.href=u.href;link.hidden=false}}catch{}const expired=stale(state);document.getElementById('freshness').textContent=state.checkedAt?`准备核验于 ${new Date(state.checkedAt).toLocaleString('zh-CN')} · ${expired?'待重新核验':'已更新'}`:invalid?'检查结果暂不可用，待助手更新':'尚未检查';document.getElementById('freshness').className=expired?'stamp warn':'stamp';const root=document.getElementById('checklist');root.replaceChildren();const labels={unknown:'无法读取当前状态',logged_out:'未登录',logged_in:'已登录 · Playwright 未授权',authorized:'已登录 · 操作已验证',ready:'已就绪',missing:'待开通',granted:'已确认'};const rows=[['蝉妈妈',state.sites.chann.state],['抖音达人广场',state.sites.buyin.state],['浏览器自动操作组件',state.component],['飞书达人表 · 读取',state.base.read],['飞书达人表 · 保存',state.base.write]];for(const[name,value]of rows){const good=!expired&&['authorized','ready','granted'].includes(value);const row=document.createElement('div');row.className='row';const icon=document.createElement('span');icon.textContent=good?'✅':'⚠';icon.setAttribute('aria-label',good?'已核验':'待处理');const label=document.createElement('strong');label.textContent=name;const status=document.createElement('span');status.textContent=(expired&&state.checkedAt?'上次：':'')+(name==='浏览器自动操作组件'&&value==='missing'?'Playwright 未安装':value==='unknown'&&state.connectionState==='disconnected'&&name==='浏览器自动操作组件'?'Playwright 未连接':labels[value]);status.className=good?'status':'status needs-action';row.append(icon,label,status);if(!good){const action=document.createElement('div');action.className='action';action.textContent='请按 Agent 引导操作。';row.append(action)}root.append(row)}
 const u=state.sourceUpdate;document.getElementById('sourceProgress').textContent=!u||u.state==='unknown'?'尚无本次更新记录':`${u.state==='completed'?'已完成':'更新中'}${Number.isInteger(u.completed)&&Number.isInteger(u.total)?` ${u.completed} / ${u.total}`:''}`;setProgress('sourceBar',u?.completed,u?.total);document.getElementById('sourceMeta').textContent=u?[Number.isInteger(u.added)?`本次入库 ${u.added} 条。`:'新增数量待核实。',Number.isInteger(u.selected)?`筛选名单 ${u.selected} 条。`:'',Number.isInteger(u.totalRecords)?`表内合计 ${u.totalRecords} 条。`:'',u.observedAt?`记录时间：${new Date(u.observedAt).toLocaleString('zh-CN')}。`:''].join(' '):'更新记录确认后显示本次新增数量。';
 const r=state.run;document.getElementById('progress').textContent=r?`${{running:'处理中',cooldown:'冷却等待',paused:'已暂停',completed:'已完成'}[r.state]} ${r.completed} / ${r.total}`:'尚无本次采集记录';setProgress('contactBar',r?.completed,r?.total);document.getElementById('runMeta').textContent=r?`当前运行 ${r.actualLanes} / ${r.targetLanes} 路。`+(Number.isInteger(r.inFlight)?` 在途 ${r.inFlight} 条。`:'')+(r.observedAt?` 记录时间：${new Date(r.observedAt).toLocaleString('zh-CN')}。`:'')+(r.nextProbeAt&&r.state==='cooldown'?` 最早探测时间：${new Date(r.nextProbeAt).toLocaleString('zh-CN')}。`:''):'开始后显示核验完成的进度。';const results=document.getElementById('results');results.replaceChildren();for(const[key,name]of[['success','已获取微信'],['not_shown','未展示微信'],['no_match','无匹配达人'],['forbidden_by_platform','平台限制'],['technicalFailure','待修复'],['unknownWrite','保存结果待核实'],['pending','待处理']]){if(!Number.isInteger(r?.results?.[key]))continue;const cell=document.createElement('div');cell.className='result';const value=document.createElement('strong');value.textContent=String(r.results[key]);cell.append(document.createTextNode(name),value);results.append(cell)}}render();
let fetching=false;
const live=location.protocol==='http:'&&location.hostname==='127.0.0.1';
async function poll(){if(!live||fetching)return;fetching=true;try{const response=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(4500)});if(!response.ok)throw Error('unavailable');state=validate(await response.json());render()}catch{render()}finally{fetching=false}}
poll();setInterval(poll,5000);setInterval(render,30000);
</script></body></html>
